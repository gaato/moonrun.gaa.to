name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: verify-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: '12.3.4'
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types and components
        run: pnpm check
      - name: Check formatting
        run: pnpm lint
      - name: Run unit tests
        run: pnpm test
      - name: Build and verify runtime assets
        run: pnpm build
      - name: Validate Cloudflare bundle without deploying
        run: pnpm exec wrangler deploy --dry-run
