name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily rebuild so the bundled cli/* commands follow their latest releases.
  schedule:
    - cron: '17 21 * * *'

permissions:
  contents: read

env:
  CI: 'true'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: verify-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: '12.3.4'
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types and components
        run: pnpm check
      - name: Check formatting
        run: pnpm lint
      - name: Run unit and integration tests
        run: pnpm test
      - name: Build, bundle cli/* commands and verify runtime assets
        run: pnpm build
      - name: Smoke-test the local Worker
        run: pnpm smoke
      - name: Validate Cloudflare bundle without deploying
        run: pnpm exec wrangler deploy --dry-run
      # Deploy exactly this verified build; rebuilding would re-resolve cli/* latest.
      - name: Upload verified site build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-build
          path: build/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy production
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: moonrun-gaa-to-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: '12.3.4'
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Worker source comes from this same commit; the assets are the
      # verified, smoke-tested build from the verify job.
      - name: Download verified site build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-build
          path: build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: e7a568f5155a30c39bef74c957811587
        run: pnpm run deploy

      - name: Check production
        if: vars.PRODUCTION_URL != ''
        env:
          SITE_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          # The moonx download mirror: cli/sh's published checksum matches the bundle.
          read -r version digest < <(node -p 'const sh = require("./build/_commands/index.json").find((e) => e.name === "cli/sh"); sh.version + " " + sh.sha256')
          check() {
            curl --fail --silent --show-error --max-time 20 "$SITE_URL/" | grep -q '/_app/' &&
              curl --fail --silent --show-error --max-time 20 "$SITE_URL/_commands/index.json" |
                cmp -s - build/_commands/index.json &&
              curl --fail --silent --show-error --max-time 20 "$SITE_URL/_mooncakes/prebuild/cli/sh@$version/sh.wasm.sha256" |
                grep -q "$digest"
          }
          for attempt in {1..12}; do
            if check; then
              exit 0
            fi
            if [ "$attempt" -eq 12 ]; then
              exit 1
            fi
            sleep 5
          done
